<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Introduction</title>
</head>
<body>
      <h1>First step with javaScript</h1>
      <h2>browser.html and backend.js</h2>
      <h3>Expected console output and Node.js execution:</h3>
      <p id="name"></p>
      <p id="age"></p>
      <p id="operation"></p>

    <script>
    const nameHtml = document.getElementById("name")
    const ageHtml = document.getElementById("age")
    const operationHtml = document.getElementById("operation")

    let name = "Manuela";
    let age = 18;
    let operationResult = 7 + 3;

    nameHtml.innerHTML = (`Creator's name: ${name}`)
    ageHtml.innerHTML = (`Creator's age: ${age}`)
    operationHtml.innerHTML = (`Result (7 + 3) = ${operationResult}`)

    </script>
    <script src="app.js"></script>
</body>
</html>
