<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loops and Interation</title>
  </head>
  <body>
    <h1>Loops and Interation</h1>
    <h3>Expected console output (For and While):</h3>
    <p>Type the sequence: 1234</p>
    <input type="password"  id="password" />
    <input type="button" id="button" value="Enter" />
    <script>
        
        //FOR
         console.log("For loop:")
         for(var i = 1; i < 11; i++){
            console.log(i)
         }

         //WHILE
         console.log("While conditional")
         var evenNum = 1

         while(evenNum <= 10 ){
            console.log(evenNum * 2)
            evenNum++
         }

 
    </script>
    <script src="app.js"></script>
  </body>
</html>
